<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroForte - Simulador de Safra</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>AgroForte: Simulador de Safra</h1>
        <p>Gerencie seus recursos, plantio e faturamento</p>
    </header>

    <main class="container">
        <div class="painel-status">
            <div>Saldo Atual: <span class="destaque-verde" id="txt-saldo">R$ 10.000,00</span></div>
            <div>Dia Atual: <span id="txt-dia">1</span>/30</div>
        </div>

        <div class="jogo-grid">
            <div class="painel-controles">
                <h3>Menu de Plantio</h3>
                <hr>
                <div class="form-group">
                    <label>Escolha o Grão para Plantar:</label>
                    <select id="select-grao" onchange="atualizarInfoPreco()">
                        <option value="soja">Soja</option>
                        <option value="milho">Milho</option>
                        <option value="aveia">Aveia</option>
                    </select>
                </div>

                <div class="painel-cotacao-dia">
                    <strong>Cotacao de Hoje (Saca 60kg):</strong>
                    <p id="txt-cotacao-real">R$ --</p>
                </div>

                <button id="btn-plantar" onclick="plantarCultura()">Plantar Carga</button>
                <button id="btn-avancar" onclick="avancarDia()" disabled style="background-color: #777;">Avançar 10 Dias</button>
                <button id="btn-colher" onclick="colherSafra()" disabled style="background-color: #777;">Colher e Vender</button>
            </div>

            <div class="painel-campo">
                <h3>Seu Campo de Cultivo</h3>
                <hr>
                <div class="cenario-paisagem-verde" id="campo-visual">
                    <div class="texto-campo-vazio">Clique em Plantar para iniciar</div>
                </div>
                <p id="status-planta" style="font-weight: bold; margin-top: 10px;">Status: Limpo</p>
            </div>
        </div>
    </main>

    <footer>
        <p>AgroForte 2026 - Gestão Visual de Alta Performance</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
