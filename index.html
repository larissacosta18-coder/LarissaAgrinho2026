<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroForte - Simulador de Safra</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="cenario">
    <div class="ceu">
        <div class="nuvens-container">
            <div class="nuvem n1"></div>
            <div class="nuvem n2"></div>
            <div class="nuvem n3"></div>
        </div>
    </div>

    <div class="morro morro-atras">
        <svg viewBox="0 0 1200 120" preserveAspectRatio="none">
            <path d="M0,30 C300,90 400,5 750,70 C1000,20 1100,80 1200,40 L1200,120 L0,120 Z" fill="#3d7512"></path>
        </svg>
    </div>

    <div class="morro morro-meio">
        <svg viewBox="0 0 1200 120" preserveAspectRatio="none">
            <path d="M0,50 C200,10 500,80 800,30 C1050,70 1150,20 1200,60 L1200,120 L0,120 Z" fill="#4a8a18"></path>
        </svg>
    </div>

    <div class="morro morro-frente">
        <svg viewBox="0 0 1200 120" preserveAspectRatio="none">
            <path d="M0,60 C350,10 700,90 1200,40 L1200,120 L0,120 Z" fill="#559e1d"></path>
        </svg>
    </div>

    <div class="painel-info">
        <h3 id="resumo-titulo">RESUMO DA SAFRA</h3>
        <div class="linha-tracejada"></div>
        <p>Cultura Atual: <span id="cultura-titulo">MILHO</span></p>
        <p>Cotação da Saca: <span id="cotacao-valor">-</span></p>
        <p>Área Plantada: <span id="txt-hectares">-</span></p>
        <p>Faturamento Estimado:</p>
        <p style="margin-left: 15px;" id="saldo-valor">-</p>
        <p>Dia: <span>15/30</span></p>

        <div class="divisor"></div>

        <h3>VALORES DE MERCADO (POR SACA)</h3>
        <div class="linha-tracejada"></div>
        <p>SOJA:  <span class="cor-mercado">R$ 135,00 | US$ 27,00 | € 24,50</span></p>
        <p>MILHO: <span class="cor-mercado">R$ 60,00  | US$ 12,00 | € 10,90</span></p>
        <p>AVEIA: <span class="cor-mercado">R$ 45,00  | US$ 9,00  | € 8,10</span></p>
    </div>

    <div class="grama-textura">
        <div id="campo-plantas" class="plantacao"></div>
    </div>

    <div class="seletor-cultura">
        <div style="margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;">
            <label for="culturas">Mudar Planta: </label>
            <select id="culturas">
                <option value="milho">Milho 🌽</option>
                <option value="soja">Soja 🌿</option>
                <option value="aveia">Aveia 🌾</option>
            </select>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px;">
            <label for="input-hectares">Hectares (ha): </label>
            <input type="number" id="input-hectares" value="250" min="1" max="1000" style="width: 80px;">
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
