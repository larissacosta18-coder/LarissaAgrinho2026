<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroForte</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="cenario">
        <div class="nuvens-container">
            <div class="nuvem"></div>
            <div class="nuvem" style="margin-top: 40px; animation-duration: 25s;"></div>
            <div class="nuvem" style="margin-top: -20px; animation-duration: 35s;"></div>
        </div>

        <div class="painel-info">
            <h3>RESUMO DA SAFRA</h3>
            <div>Cultura Atual: <span id="cultura-titulo">SOJA</span></div>
            <div>Cotação Hoje: R$ 52,00 / US$ 10,40</div>
            <div>Hectares: 250 ha (500 alqueires)</div>
            <div>Saldo: R$ 10.000,00</div>
            <div>Dia: 15/30</div>

            <div class="divisor"></div>

            <h3>VALORES DO MERCADO (500 ALQUEIRES)</h3>
            <div>SOJA: R$ 1.500,00 / US$ 300,00</div>
            <div>MILHO: R$ 1.625,00 / US$ 325,00</div>
            <div>AVEIA: R$ 1.300,00 / US$ 260,00</div>
        </div>

        <div class="grama-textura">
            <div class="plantacao" id="campo-plantas"></div>
        </div>

        <div class="seletor-cultura">
            <label for="culturas">Mudar Planta: </label>
            <select id="culturas">
                <option value="soja">Soja 🌿</option>
                <option value="milho">Milho 🌽</option>
                <option value="aveia">Aveia 🌾</option>
            </select>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
